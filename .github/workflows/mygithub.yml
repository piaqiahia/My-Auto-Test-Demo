name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright playwright requests allure-pytest PyYAML
        playwright install --with-deps

    - name: Run tests with Pytest
      run: |
        pytest tests/ --alluredir=./allure-results -v  # 建议指定 tests/ 目录

      # 手动安装allure CLI
    - name: Install Allure CLI
      run: |
        wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
        tar -zxvf allure-2.29.0.tgz
        sudo mv allure-2.29.0 /opt/allure
        echo "/opt/allure/bin" >>  $GITHUB_PATH  
        

    - name: Generate Allure report
      run: |
        allure generate ./allure-results --clean -o ./allure-report

    - name: Check report content
      run: |
        ls -la ./allure-report/
        echo "Report size:  $ (du -sh ./allure-report)"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        # 强制使用简单的分支推送，避免复杂的 URL 参数
        force_orphan: false # 默认值，显式声明
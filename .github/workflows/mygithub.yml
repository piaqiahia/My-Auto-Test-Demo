name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps

    # 安装Jmeter
    - name: Install JMeter
      run: |
        # 下载 JMeter (这里以 5.6.3 为例，你可以替换为最新版)
        JMETER_VERSION=5.6.3
        wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz
        tar -xzf apache-jmeter-${JMETER_VERSION}.tgz
        # 将 JMeter 的 bin 目录加入 PATH
        echo "$(pwd)/apache-jmeter-${JMETER_VERSION}/bin" >> $GITHUB_PATH

    - name: Run tests with Pytest
      run: |
        pytest tests/ --alluredir=./allure-results -v  # 建议指定 tests/ 目录
      continue-on-error: true # 重要：测试用例错误时继续运行CICD流程

    # 运行Jmeter脚本
    - name: Run JMeter Tests
      run: |
        mkdir -p ./jmeter-results
        # 使用 -n (非GUI), -t (脚本), -l (日志), -e (生成报告), -o (报告输出目录)
        jmeter -n -t ./jmeter_script/View_Results_Tree.jmx -l ./jmeter-results/result.jtl -e -o ./jmeter-report
      continue-on-error: true

      # 手动安装allure CLI
    - name: Install Allure CLI
      run: |
        wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
        tar -zxvf allure-2.29.0.tgz
        sudo mv allure-2.29.0 /opt/allure
        echo "/opt/allure/bin" >>  $GITHUB_PATH  

    - name: Generate Allure report
      run: |
        allure generate ./allure-results --clean -o ./allure-report

    - name: Check report content
      run: |
        ls -la ./allure-report/
        echo "Report size:  $ (du -sh ./allure-report)"

    # 创建一个统一的发布目录
    - name: Prepare Unified Report Directory
      run: |
        mkdir -p ./gh-pages-deploy
        # 复制 Allure 报告到 /allure 子目录
        cp -r ./allure-report ./gh-pages-deploy/allure
        # 复制 JMeter 报告到 /jmeter 子目录
        cp -r ./jmeter-report ./gh-pages-deploy/jmeter

    # 部署到 GitHub Pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.ACTION_DEPLOY_KEY }}
        publish_dir: ./gh-pages-deploy # 部署整个统一目录